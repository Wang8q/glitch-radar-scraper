name: glitch-radar scraper

on:
  schedule:
    - cron: '*/5 * * * *'   # 每 5 分钟一轮(公开仓库免费额度无限)
  workflow_dispatch: {}
  push:
    branches:
      - main

concurrency:
  group: scrape
  cancel-in-progress: true   # 新一轮开始时取消上一轮,始终追最新

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 每个目标一台并行机器,总 wall time ≈ 单目标耗时
        target:
          - walmart
          - costco
          - canadiantire
          - londondrugs
          - amazon
          - simons
          - sportinglife
          - mec
          - aritzia
          - homehardware
          - uniqlo
          - hm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache 隐身浏览器
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/camoufox
            ~/.cache/scrapling
          key: scrapling-browsers-v1

      - name: Install Scrapling
        run: |
          pip install -U "scrapling[all]"
          scrapling install || true

      - name: 抓取 ${{ matrix.target }}
        env:
          RADAR_URL: ${{ secrets.RADAR_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          ONLY_TARGET: ${{ matrix.target }}
        run: python scrape_targets.py

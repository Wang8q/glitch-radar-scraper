name: glitch-radar scraper

# 节奏:自链式触发(每轮结束自动发起下一轮,轮期间 GitHub 自动跳过外部触发)
# cron 仅作兜底,防止链断裂
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target:
          - walmart
          - canadiantire
          - londondrugs
          - amazon
          - simons
          - sportinglife
          - mec
          - aritzia
          - homehardware
          - uniqlo
          - hm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cache 隐身浏览器
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/camoufox
            ~/.cache/scrapling
          key: scrapling-browsers-v1

      - name: Install Scrapling
        run: |
          pip install -U "scrapling[all]"
          scrapling install || true

      - name: 抓取 ${{ matrix.target }}
        env:
          RADAR_URL: ${{ secrets.RADAR_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          ONLY_TARGET: ${{ matrix.target }}
        run: python scrape_targets.py

      - name: 链式触发下一轮(持续扫描)
        if: matrix.target == 'walmart' && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 90   # 休 90 秒再开下一轮,整体节奏约 5-10 分钟一轮
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/scrape.yml/dispatches" -f ref=main || echo "链式触发失败(cron 兜底)"
